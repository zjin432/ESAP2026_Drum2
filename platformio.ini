; PlatformIO project config for ESP32-C3 - servo drum striker
;
; If you're using a specific dev board (e.g. Seeed XIAO ESP32-C3,
; ESP32-C3-DevKitM-1, M5Stamp C3, etc.), swap the "board" line for your
; exact model - run `pio boards espressif32 | grep -i c3` to list options.

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
    madhephaestus/ESP32Servo @ ^3.0.0
    bblanchon/ArduinoJson @ ^7.0.0